<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <base href="/verdelago-lostfound/">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2E5E4E">
  <title>Perdidos e Achados — Verdelago</title>
  <link rel="icon" type="image/svg+xml" href="./icon-green.svg">
  <link rel="stylesheet" href="./style.css">
  <style>
    /* login */
    #login{ position:fixed; inset:0; background:#2E5E4E; color:#fff; display:flex; align-items:center; justify-content:center; padding:26px; z-index:100; }
    #login .card{ width:100%; max-width:360px; text-align:center; }
    #login img{ height:40px; margin-bottom:10px; }
    #login h1{ font-size:1.05rem; letter-spacing:.22em; text-transform:uppercase; font-weight:600; margin:0 0 26px; opacity:.9; }
    #login input{ width:100%; box-sizing:border-box; border:none; border-radius:13px; padding:15px 16px; font-size:1.05rem; margin-bottom:12px; font-family:inherit; }
    #login button{ width:100%; background:#fff; color:#2E5E4E; border:none; border-radius:13px; padding:16px; font-size:1.08rem; font-weight:800; cursor:pointer; font-family:inherit; }
    #login .err{ background:rgba(0,0,0,.22); border-radius:10px; padding:11px; font-size:.88rem; margin-bottom:12px; display:none; }
    #login .muted{ opacity:.6; font-size:.78rem; margin-top:18px; }
    .navbar__readonly{ font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#2E5E4E;background:rgba(46,94,78,.10);padding:6px 12px;border-radius:20px;cursor:pointer;border:none; }
    .item-tile{ cursor:zoom-in; }
    /* lightbox */
    .lb{ position:fixed;inset:0;z-index:120;background:rgba(15,23,20,.93);display:flex;align-items:center;justify-content:center; }
    .lb[hidden]{ display:none; }
    .lb img{ max-width:92vw;max-height:80vh;border-radius:10px; }
    .lb button{ position:absolute;background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;border-radius:50%;width:50px;height:50px;font-size:1.7rem; }
    .lb .cl{ top:20px;right:20px; } .lb .pv{ left:16px;top:50%;transform:translateY(-50%); } .lb .nx{ right:16px;top:50%;transform:translateY(-50%); }
    /* upload sheet */
    #up{ position:fixed;inset:0;z-index:110;background:#F4F7F4;overflow-y:auto; }
    #up[hidden]{ display:none; }
    #up .top{ background:#2E5E4E;color:#fff;padding:16px 18px calc(16px + env(safe-area-inset-top,0)) ;display:flex;align-items:center;gap:12px; }
    #up .top b{ font-size:1.05rem; } #up .top .x{ margin-left:auto;background:none;border:none;color:#fff;font-size:1.7rem;cursor:pointer; }
    #up .wrap{ max-width:560px;margin:0 auto;padding:18px 16px 60px; }
    #up label{ display:block;font-size:.82rem;font-weight:600;color:#4a5a50;margin:18px 0 6px; }
    #up input[type=text], #up select{ width:100%;box-sizing:border-box;border:1.5px solid #DDE6E0;border-radius:14px;padding:15px 16px;font-size:1.05rem;background:#fff;font-family:inherit; }
    .photo-btn{ display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:2.5px dashed #BCD0C4;border-radius:18px;padding:30px 18px;text-align:center;cursor:pointer;position:relative; }
    .photo-btn svg{ width:44px;height:44px;color:#2E5E4E; } .photo-btn input{ position:absolute;inset:0;opacity:0;width:100%;height:100%; }
    .previews{ display:flex;flex-wrap:wrap;gap:12px;margin-top:12px; } .pwrap{ width:84px;height:84px;border-radius:12px;overflow:hidden;position:relative; } .pwrap img{ width:100%;height:100%;object-fit:cover; }
    .pwrap .rm{ position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;background:#DC2626;color:#fff;border:2px solid #fff;font-size:16px;cursor:pointer; }
    .send{ width:100%;margin-top:26px;background:#2E5E4E;color:#fff;border:none;border-radius:16px;padding:18px;font-size:1.15rem;font-weight:800;cursor:pointer;font-family:inherit; }
    .req::after{ content:' *';color:#DC2626; }
    #up .overlay{ position:fixed;inset:0;background:rgba(46,94,78,.96);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5; }
    #up .overlay[hidden]{ display:none; } .spin{ width:48px;height:48px;border:5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite; } @keyframes sp{ to{ transform:rotate(360deg); } }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login">
    <div class="card">
      <img src="./logo-cream.svg" alt="Verdelago" onerror="this.style.display='none'">
      <h1>Perdidos e Achados</h1>
      <div class="err" id="login-err"></div>
      <input id="u" type="text" autocapitalize="none" autocorrect="off" placeholder="Utilizador (ex. housekeeping)" autocomplete="username">
      <input id="p" type="password" placeholder="Palavra-passe" autocomplete="current-password">
      <button id="login-btn">Entrar</button>
      <div class="muted">Verdelago Resort</div>
    </div>
  </div>

  <!-- APP -->
  <div id="appwrap" class="page-wrapper" hidden>
    <nav class="navbar" style="position:fixed;">
      <div class="navbar__inner">
        <a href="#" class="navbar__brand" onclick="return false;">
          <img src="./logo.svg" alt="Verdelago" style="height:28px;">
          <span class="navbar__divider"></span>
          <span class="navbar__app-name">Perdidos e Achados</span>
        </a>
        <div class="navbar__user">
          <button class="navbar__readonly" id="logout">Sair</button>
        </div>
      </div>
    </nav>
    <main class="page-content">
      <div class="container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap;">
          <h1 style="font-size:1.55rem;font-weight:800;margin:0;letter-spacing:-.025em;color:#0D1117;">Perdidos e Achados</h1>
          <div style="display:flex;align-items:center;gap:12px;">
            <span id="count" style="font-size:.78rem;color:#8A948C;"></span>
            <button class="btn btn--primary" id="new-btn" style="border-radius:13px;padding:9px 22px;font-weight:700;">+ Novo</button>
          </div>
        </div>
        <form id="filters" onsubmit="return false;">
          <div class="filter-bar">
            <div class="filter-bar__pills" id="pills">
              <a href="#" class="fpill fpill--active" data-status="">Todos <span class="fpill__n" data-c="all"></span></a>
              <a href="#" class="fpill" data-status="found">Encontrados <span class="fpill__n" data-c="found"></span></a>
              <a href="#" class="fpill" data-status="stored">Armazenados <span class="fpill__n" data-c="stored"></span></a>
            </div>
            <div class="filter-bar__search">
              <div class="search-field">
                <svg class="search-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input id="q" class="search-field__input" type="text" placeholder="Pesquisar..." autocomplete="off">
              </div>
              <select id="catf" class="form-select" style="max-width:145px;font-size:.81rem;min-height:38px;border-radius:20px;border:1.5px solid #E4EBE5;"><option value="">Categoria</option></select>
            </div>
          </div>
        </form>
        <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px;"></div>
        <div id="empty" class="empty-state" style="padding:60px 20px;" hidden><div class="empty-state__title">Sem artigos</div></div>
      </div>
    </main>
  </div>

  <!-- UPLOAD SHEET -->
  <div id="up" hidden>
    <div class="top"><b>Registar artigo</b><button class="x" id="up-close">&times;</button></div>
    <div class="wrap">
      <form id="up-form">
        <label>Foto do artigo</label>
        <div class="photo-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span style="font-weight:700;color:#16241E;">Tirar foto</span><span style="font-size:.85rem;color:#7a8a80;">Toque para abrir a câmara (até 5)</span>
          <input type="file" id="up-img" accept="image/*" capture="environment" multiple>
        </div>
        <div class="previews" id="up-prev"></div>
        <label class="req">O que é?</label>
        <input type="text" id="up-title" placeholder="ex. óculos, toalha, carregador" required>
        <label>Categoria</label>
        <select id="up-cat"></select>
        <label>Quarto / Local (opcional)</label>
        <input type="text" id="up-loc" placeholder="ex. Piscina, Receção">
        <label>Onde vai ser guardado</label>
        <select id="up-store"></select>
        <label>O seu nome</label>
        <input type="text" id="up-by" placeholder="ex. Maria">
        <button type="submit" class="send">Enviar</button>
      </form>
    </div>
    <div class="overlay" id="up-sending" hidden><div class="spin"></div><p>A enviar…</p></div>
    <div class="overlay" id="up-done" hidden>
      <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      <p style="font-size:1.3rem;font-weight:800;">Registado!</p>
      <button class="send" style="max-width:240px;background:#fff;color:#2E5E4E;" id="up-again">Adicionar outro</button>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lb" class="lb" hidden>
    <button class="cl">&times;</button><button class="pv">&#8249;</button><img id="lb-img" alt=""><button class="nx">&#8250;</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./sbapp.js" defer></script>
</body>
</html>
