<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Public link works for anyone it's shared with, but we don't invite search
       engines to index guests' belongings. Flip to "index" if you want it findable. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Verdelago · Perdidos e Achados</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%232E5E4E'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='%23F4EFE6'%3EV%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img class="brand__logo" src="./logo.svg" alt="Verdelago"
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'brand__name',textContent:'VERDELAGO'}))">
      <span class="brand__sub">Perdidos&nbsp;&amp;&nbsp;Achados</span>
    </div>
    <p class="tagline">Artigos encontrados no resort. Reconhece algo seu? Contacte a receção.</p>
  </header>

  <section class="controls" aria-label="Filtros">
    <input id="search" class="search" type="search" placeholder="Procurar (ex.: óculos, mochila, carteira…)" autocomplete="off">
    <select id="category" class="category" aria-label="Categoria">
      <option value="">Todas as categorias</option>
    </select>
  </section>

  <p id="status" class="status" role="status">A carregar…</p>

  <main id="grid" class="grid" aria-live="polite"></main>

  <footer class="site-footer">
    <p id="foot-claim"></p>
    <p class="foot-meta"><span id="updated"></span></p>
  </footer>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox__close" aria-label="Fechar">&times;</button>
    <button class="lightbox__nav lightbox__prev" aria-label="Anterior">&#8249;</button>
    <img id="lightbox-img" class="lightbox__img" alt="">
    <button class="lightbox__nav lightbox__next" aria-label="Seguinte">&#8250;</button>
    <div id="lightbox-caption" class="lightbox__caption"></div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
